<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>디지몬의 메뉴 추천</title>
<style>
  :root{
    --cream: #FFF8EC;
    --cream-card: #FFFDF7;
    --blue: #4A90E2;
    --blue-dark: #2F6BC4;
    --blue-light: #D6EAFB;
    --text: #3E3226;
    --shadow: rgba(74, 144, 226, 0.25);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(180deg, #FFF8EC 0%, #EAF3FC 100%);
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 32px 16px 64px;
  }

  .wrap {
    width: 100%;
    max-width: 560px;
  }

  header {
    text-align: center;
    margin-bottom: 28px;
  }

  header .title-emoji {
    font-size: 52px;
    line-height: 1;
  }

  h1 {
    font-size: 32px;
    margin: 12px 0 6px;
    color: var(--blue-dark);
  }

  header p {
    font-size: 18px;
    color: #8A7A63;
    margin: 0;
  }

  .btn-area {
    text-align: center;
    margin-bottom: 28px;
  }

  button {
    font-family: inherit;
    cursor: pointer;
    border: none;
    border-radius: 100px;
    font-weight: 700;
  }

  #recommendBtn {
    font-size: 22px;
    padding: 18px 44px;
    background: var(--blue);
    color: #fff;
    box-shadow: 0 8px 0 var(--blue-dark);
    transition: transform 0.08s ease;
  }

  #recommendBtn:active {
    transform: translateY(6px);
    box-shadow: 0 2px 0 var(--blue-dark);
  }

  .card {
    display: none;
    background: var(--cream-card);
    border: 3px solid var(--blue-light);
    border-radius: 28px;
    padding: 28px 24px;
    box-shadow: 0 12px 28px var(--shadow);
    animation: pop 0.35s ease;
  }

  .card.show { display: block; }

  @keyframes pop {
    from { opacity: 0; transform: scale(0.92); }
    to { opacity: 1; transform: scale(1); }
  }

  .section-label {
    font-size: 15px;
    font-weight: 700;
    color: var(--blue-dark);
    background: var(--blue-light);
    display: inline-block;
    padding: 4px 14px;
    border-radius: 100px;
    margin-bottom: 12px;
  }

  .food-photo {
    width: 100%;
    aspect-ratio: 1 / 1;
    max-height: 220px;
    border-radius: 22px;
    background: linear-gradient(160deg, #FFE9C7, #FFD9A0);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 96px;
    margin-bottom: 10px;
    box-shadow: inset 0 0 0 4px #fff;
  }

  .food-name {
    text-align: center;
    font-size: 24px;
    font-weight: 800;
    margin-bottom: 26px;
    color: var(--text);
  }

  .reason-box {
    background: var(--cream);
    border-radius: 16px;
    padding: 14px 18px;
    font-size: 17px;
    line-height: 1.55;
    margin-bottom: 24px;
    color: #5B4C3A;
  }

  .digimon-box {
    text-align: center;
    background: var(--blue-light);
    border-radius: 22px;
    padding: 24px 18px;
    margin-bottom: 20px;
  }

  .digimon-emoji {
    font-size: 88px;
    line-height: 1;
    display: block;
    margin-bottom: 6px;
  }

  .digimon-name {
    font-size: 26px;
    font-weight: 800;
    color: var(--blue-dark);
    margin-bottom: 10px;
  }

  .digimon-reason {
    font-size: 17px;
    line-height: 1.55;
    color: #3E5A80;
  }

  .side-box {
    display: flex;
    align-items: center;
    gap: 14px;
    background: #FFF3DC;
    border-radius: 18px;
    padding: 16px 18px;
  }

  .side-emoji {
    font-size: 44px;
    flex-shrink: 0;
  }

  .side-text {
    font-size: 16px;
    line-height: 1.5;
  }

  .side-text b {
    font-size: 18px;
    display: block;
    margin-bottom: 2px;
    color: var(--blue-dark);
  }

  #retryBtn {
    display: block;
    margin: 24px auto 0;
    font-size: 18px;
    padding: 12px 30px;
    background: var(--cream-card);
    border: 2px solid var(--blue);
    color: var(--blue-dark);
  }

  #retryBtn:hover { background: var(--blue-light); }

  .hidden { display: none; }
</style>
</head>

<div class="wrap">

    <div class="side-box">

</div>

// 최근에 나온 디지몬은 3번 안에는 다시 나오지 않도록 기록
let recentDigimons = [];

function recommend() {
  const historyLimit = Math.min(3, data.length - 1);

  let candidates = data
    .map((d, i) => i)
    .filter(i => !recentDigimons.includes(data[i].digimonName));

  // 후보가 없으면(데이터가 적을 때) 제한을 완화
  if (candidates.length === 0) {
    candidates = data.map((d, i) => i);
  }

  const idx = candidates[Math.floor(Math.random() * candidates.length)];

  recentDigimons.push(data[idx].digimonName);
  if (recentDigimons.length > historyLimit) {
    recentDigimons.shift();
  }

  const d = data[idx];

  document.getElementById('foodPhoto').textContent = d.foodEmoji;
  document.getElementById('foodName').textContent = d.foodName;
  document.getElementById('foodReason').textContent = d.foodReason;

  document.getElementById('digimonEmoji').textContent = d.digimonEmoji;
  document.getElementById('digimonName').textContent = d.digimonName;
  document.getElementById('digimonReason').textContent = d.digimonReason;

  document.getElementById('sideEmoji').textContent = d.sideEmoji;
  document.getElementById('sideName').textContent = d.sideName;
  document.getElementById('sideReason').textContent = d.sideReason;

  const card = document.getElementById('card');
  card.classList.remove('show');
  void card.offsetWidth;
  card.classList.add('show');
}
